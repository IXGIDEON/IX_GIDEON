<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories Under The Stars - IX GIDEON</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #0b0d17; color: white; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* --- SAMPUL UTAMA --- */
        .hero-cover {
            height: 100vh; width: 100%; position: relative; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            background: linear-gradient(rgba(11, 13, 23, 0.4), rgba(11, 13, 23, 0.8)), url('sampul.jpeg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        .hero-title {
            font-family: 'Dancing Script', cursive; font-size: 6rem; margin: 0;
            background: linear-gradient(to bottom, #fff, #ffb7c5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.4)); z-index: 2;
        }

        /* --- GALERI --- */
        .gallery-section { padding: 60px 20px; background: radial-gradient(circle at top, #1e2761 0%, #0b0d17 100%); position: relative; }
        .container { max-width: 1200px; margin: 0 auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }

        .card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border-radius: 15px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease; cursor: pointer;
        }

        .card:hover { transform: translateY(-10px); border-color: #ffb7c5; }
        .card img { width: 100%; height: 300px; object-fit: cover; display: block; }

        /* --- MODAL / LIGHTBOX --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .lightbox img {
            max-width: 90%; max-height: 80%;
            border-radius: 10px; box-shadow: 0 0 20px rgba(255, 183, 197, 0.5);
            transform: scale(0.8); transition: transform 0.3s ease;
        }

        .lightbox.active { display: flex; }
        .lightbox.active img { transform: scale(1); }

        .close-btn {
            position: absolute; top: 20px; right: 30px;
            font-size: 40px; color: white; cursor: pointer; font-weight: bold; z-index: 10001;
        }

        /* Navigasi Tombol Geser */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.15); color: white; border: none;
            padding: 15px 20px; cursor: pointer; font-size: 30px; border-radius: 50%;
            transition: 0.3s; z-index: 10000;
        }
        .nav-btn:hover { background: rgba(255, 183, 197, 0.6); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        footer { text-align: center; padding: 80px 20px; opacity: 0.6; background: #0b0d17; }
        #star-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        @media (max-width: 768px) {
            .hero-title { font-size: 3.5rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .card img { height: 200px; }
            .nav-btn { padding: 10px 15px; font-size: 20px; background: rgba(255,255,255,0.2); }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="lightbox" id="lightbox">
    <span class="close-btn" onclick="closeLightbox()">&times;</span>
    <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="Zoomed Photo" onclick="event.stopPropagation()">
    <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
</div>

<div class="hero-cover">
    <div id="star-container"></div>
    <h1 class="hero-title">IX_GIDEON</h1>
    <p class="hero-subtitle">80 Memories</p>
    <p class="hero-tagline">"Tekan Layar atau untuk Memutar Musik✨"</p>
    <div class="scroll-down" style="position: absolute; bottom: 30px; animation: bounce 2s infinite; opacity: 0.7;">↓ Scroll Down</div>
</div>

<div class="gallery-section">
    <div class="container">
        <div class="gallery-grid" id="photo-gallery"></div>
    </div>
</div>

<footer>
    <p>See you in the next story...<br><b>Instagram: IX_GIDEON❤️</b></p>
</footer>

<script>
    // 1. Logika Audio (Memastikan audio terputar saat interaksi pertama)
    const music = document.getElementById('bgMusic');
    let isMusicPlaying = false;

    function playAudio() {
        if (!isMusicPlaying) {
            music.play().then(() => {
                isMusicPlaying = true;
                // Hapus event listener setelah musik berhasil diputar
                ['click', 'scroll', 'touchstart', 'keydown'].forEach(evt => 
                    window.removeEventListener(evt, playAudio)
                );
            }).catch(error => console.log("Menunggu interaksi pengguna..."));
        }
    }

    // Pasang listener pada berbagai jenis interaksi
    ['click', 'scroll', 'touchstart', 'keydown'].forEach(evt => 
        window.addEventListener(evt, playAudio, { once: false })
    );

    // 2. Galeri & Fitur Geser Foto
    const gallery = document.getElementById('photo-gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let currentIdx = 1;
    const totalPhotos = 80;

    for (let i = 1; i <= totalPhotos; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        
        const img = document.createElement('img');
        img.src = `foto${i}.jpeg`; 
        img.alt = `Memory Gideon ${i}`;
        img.loading = "lazy";
        
        card.onclick = (e) => {
            e.stopPropagation(); // Mencegah konflik klik
            openLightbox(i);
        };
        
        card.appendChild(img);
        gallery.appendChild(card);
    }

    function openLightbox(index) {
        currentIdx = index;
        lightboxImg.src = `foto${currentIdx}.jpeg`;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = 'auto';
    }

    function changeImage(step) {
        currentIdx += step;
        if (currentIdx > totalPhotos) currentIdx = 1;
        if (currentIdx < 1) currentIdx = totalPhotos;
        lightboxImg.src = `foto${currentIdx}.jpeg`;
    }

    // Klik luar gambar untuk tutup
    lightbox.onclick = (e) => {
        if (e.target === lightbox) closeLightbox();
    };

    // Navigasi Keyboard
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === "ArrowRight") changeImage(1);
        if (e.key === "ArrowLeft") changeImage(-1);
        if (e.key === "Escape") closeLightbox();
    });

    // 3. Animasi Bintang
    function createStars() {
        const container = document.getElementById('star-container');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.background = 'white';
            star.style.borderRadius = '50%';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.opacity = Math.random();
            star.animate([{ opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }], {
                duration: 2000 + Math.random() * 3000,
                iterations: Infinity
            });
            container.appendChild(star);
        }
    }
    createStars();
</script>

</body>
</html>
