<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories Under The Stars - IX GIDEON</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #0b0d17; color: white; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* --- SAMPUL UTAMA --- */
        .hero-cover {
            height: 100vh; width: 100%; position: relative; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            background: linear-gradient(rgba(11, 13, 23, 0.4), rgba(11, 13, 23, 0.8)), url('sampul.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        .hero-title {
            font-family: 'Dancing Script', cursive; font-size: 6rem; margin: 0;
            background: linear-gradient(to bottom, #fff, #ffb7c5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.4)); z-index: 2;
        }

        /* --- GALERI --- */
        .gallery-section { padding: 60px 20px; background: radial-gradient(circle at top, #1e2761 0%, #0b0d17 100%); position: relative; }
        .container { max-width: 1200px; margin: 0 auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }

        .card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border-radius: 15px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease; cursor: pointer;
        }

        .card:hover { transform: translateY(-10px); border-color: #ffb7c5; }
        .card img { width: 100%; height: 300px; object-fit: cover; display: block; }

        /* --- MESSAGE SLOTS SECTION --- */
        .message-section { padding: 40px 20px; background: #0b0d17; text-align: center; }
        
        .message-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, #ffb7c5, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,183,197,0.5));
        }

        .message-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .message-slot {
            background: linear-gradient(135deg, #0056b3 0%, #00aaff 100%);
            padding: 15px;
            border: 2px solid #3399ff;
            transform: skewX(-15deg); 
            transition: 0.3s;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }
        .message-slot:hover { transform: skewX(-15deg) scale(1.05); border-color: white; }
        .message-text {
            transform: skewX(15deg); 
            color: white;
            font-weight: 600;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.3;
        }

        /* --- MODAL / LIGHTBOX (Sederhana tanpa Zoom/Nav) --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .lightbox-container {
            position: relative; width: 90%; height: 80%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .lightbox img {
            max-width: 100%; max-height: 100%;
            border-radius: 10px; box-shadow: 0 0 20px rgba(255, 183, 197, 0.5);
        }

        .close-btn {
            position: absolute; top: 20px; right: 30px;
            font-size: 40px; color: white; cursor: pointer; font-weight: bold; z-index: 10001;
        }

        footer { text-align: center; padding: 80px 20px; opacity: 0.6; background: #0b0d17; }
        #star-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        @media (max-width: 768px) {
            .hero-title { font-size: 3.5rem; }
            .message-title { font-size: 2.2rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .message-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card img { height: 200px; }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="lightbox" id="lightbox">
    <span class="close-btn" onclick="closeLightbox()">&times;</span>
    <div class="lightbox-container">
        <img id="lightbox-img" src="" alt="Photo">
    </div>
</div>

<div class="hero-cover">
    <div id="star-container"></div>
    <h1 class="hero-title">IX_GIDEON</h1>
    <p class="hero-subtitle">131 Memories</p>
    <p class="hero-tagline">"Sentuh Layar untuk Musik=✨"</p>
</div>

<div class="gallery-section">
    <div class="container">
        <div class="gallery-grid" id="photo-gallery"></div>
    </div>
</div>

<div class="message-section">
    <h2 class="message-title">Pesan Dari Kami</h2>
    <div class="message-grid" id="message-container"></div>
</div>

<footer>
    <p>See you in the next story...<br><b>Instagram: IX_GIDEON❤️</b></p>
</footer>

<script>
    // 1. Audio Logic
    const music = document.getElementById('bgMusic');
    let isMusicPlaying = false;
    function playAudio() {
        if (!isMusicPlaying) {
            music.play().then(() => {
                isMusicPlaying = true;
                ['click', 'scroll', 'touchstart'].forEach(evt => window.removeEventListener(evt, playAudio));
            }).catch(e => {});
        }
    }
    ['click', 'scroll', 'touchstart'].forEach(evt => window.addEventListener(evt, playAudio));

    // 2. Galeri Foto (.jpg)
    const gallery = document.getElementById('photo-gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const totalPhotos = 129;

    for (let i = 1; i <= totalPhotos; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        const img = document.createElement('img');
        img.src = `foto${i}.jpg`;
        img.loading = "lazy";
        card.onclick = () => openLightbox(i);
        card.appendChild(img);
        gallery.appendChild(card);
    }

    // 3. Pesan
    const messageContainer = document.getElementById('message-container');
    const totalSlots = 27;
    
    const dataPesan = [
        "buk sintia : <br> Love you my Kiddos 🥰❤️‍🔥",
        "Ruben : <br> aku sayang kalian❤️❤️❤️",
        "Piang : <br> mabar epep",
        "Evayy : <br> Sa pukul ko nanti..😒",
        "jejescott : <br> nak ikut main roblox",
        "Reyvan : <br> kam nanti rinduh saya pasti",
        "cello  : <br> ayo main",
        "Frevol : Cape-cape cari jokes, ternyata hanya sa yang lucu",
        "Kesya : Sekolah sini kaya tombol, tertekan.",
        "Berayen: ngantuk",
        "Lawrence : PULSEK MABAR ROBLOXXX!",
        "Stefan : Gass mabar🤟🏻",
        "Opayy : Kam Haruss sukses❤️",
        "Prisca : hidup kalian bakal sepi kalau gak ada gue",
    ];

    for (let i = 0; i < totalSlots; i++) {
        const slot = document.createElement('div');
        slot.className = 'message-slot';
        const text = document.createElement('div');
        text.className = 'message-text';
        text.innerHTML = dataPesan[i] || ""; 
        slot.appendChild(text);
        messageContainer.appendChild(slot);
    }

    // 4. Lightbox Functions (Tanpa Zoom & Navigasi)
    function openLightbox(index) {
        lightboxImg.src = `foto${index}.jpg`;
        lightbox.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    lightbox.onclick = (e) => {
        if (e.target === lightbox || e.target.className === 'lightbox-container') closeLightbox();
    };

    document.addEventListener('keydown', (e) => {
        if (lightbox.style.display === 'flex' && e.key === "Escape") closeLightbox();
    });

    // 5. Bintang Bergerak
    function createStars() {
        const container = document.getElementById('star-container');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.background = 'white';
            star.style.borderRadius = '50%';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.opacity = Math.random();
            star.animate([{ opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }], {
                duration: 2000 + Math.random() * 3000,
                iterations: Infinity
            });
            container.appendChild(star);
        }
    }
    createStars();
</script>

</body>
</html>
